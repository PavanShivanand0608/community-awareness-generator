
name: Community Campaign Generator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest wandb

      - name: Download trained model from W&B
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          python - <<'PY'
          import wandb

          api = wandb.Api()

          artifact = api.artifact(
              "phoenixrising27623-pavan/community-awareness-sdg-classifier/community-awareness-sdg-classifier:v0",
              type="model"
          )

          artifact.download(root="notebooks/models")

          print("W&B model artifact downloaded successfully.")
          PY

      - name: Verify model files
        run: |
          test -f notebooks/models/linear_svm_baseline.joblib
          test -f notebooks/models/baseline_config.json
          echo "Model and configuration files found."

      - name: Run predictor tests
        run: |
          python -m pytest tests/test_predictor.py -v
